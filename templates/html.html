<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

        <header>
                <h1>My Blog</h1>
        </header>

        <main>
                {% for post in posts %}
                <div class="post-card">
                        <h2>{{ post.title }}</h2>
                        <h3>{{ post.subtitle }}</h3>
                        <a href="/post/{{ post.id }}" class="read-btn">Read</a>
                </div>
                {% endfor %}
        </main>

        <footer>Made with <span class="heart">❤️</span> in London.</footer>

</body>
</html>
