<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ post.title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

        <header>
                <a href="/" class="back-link">← My Blog</a>
        </header>

        <main>
                <div class="post-full">
                        <h1>{{ post.title }}</h1>
                        <h2 class="subtitle">{{ post.subtitle }}</h2>
                        <p class="body">{{ post.body }}</p>
                </div>
        </main>

        <footer>Made with <span class="heart">❤️</span> in London.</footer>

</body>
</html>
